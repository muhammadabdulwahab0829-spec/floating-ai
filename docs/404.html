<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Kitty AI Voice & Desktop Pet Assistant</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Encodes path and query to prevent 404 when refreshing sub-routes or opening by direct link
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var repoSegment = l.pathname.split('/')[1];
      // If deployed at https://username.github.io/repo-name/
      if (repoSegment && !repoSegment.includes('.')) {
        pathSegmentsToKeep = 1;
      }
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
        encodeURIComponent(l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') + (l.search ? l.search : '') + l.hash)
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Kitty Assistant...</p>
  </body>
</html>
